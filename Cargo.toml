[package]
name = "dioxus-shared"
version = "0.1.0"
edition = "2021"
description = "Shared Rust library for Dioxus applications - pure Rust business logic"
authors = ["Your Name"]

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ts-rs = { version = "8", features = ["chrono-impl"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Once cell
once_cell = "1"

# Error handling
thiserror = "2"

# nosql_orm for database (optional - not needed for web UI)
nosql_orm = { git = "https://github.com/rusnakdima/nosql_orm.git", rev = "756a681f151a6388413cf6b5d66f4476d26e8321", optional = true, features = ["json", "mongo", "full", "validators"] }

# Utilities
regex = "1"
uuid = { version = "1", optional = true, features = ["v4", "serde"] }
bcrypt = { version = "0.17", optional = true }
dirs = { version = "5", optional = true }
log = "0.4"
paste = "1.0"
lazy_static = "1.5"
async-trait = "0.1"
anyhow = "1"

# HTTP client (for update checking) - optional
reqwest = { version = "0.12", optional = true, features = ["json", "stream"] }
tokio-tungstenite = { version = "0.23", optional = true }

# Environment loading (optional)
dotenvy = { version = "0.15", optional = true }

# Async runtime - optional, not needed for web UI
tokio = { version = "1", optional = true, features = ["rt", "sync", "net", "time"] }
futures-util = { version = "0.3", optional = true }

# Dioxus UI components (web-ui feature)
dioxus = { version = "0.8.0-alpha.1", optional = true, features = ["html", "macro", "hooks", "signals", "router", "lib", "web"] }
dioxus-core = { version = "0.8.0-alpha.1", optional = true }
dioxus_elements = { package = "dioxus-html", version = "0.8.0-alpha.1", optional = true }
dioxus-signals = { version = "0.8.0-alpha.1", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "MediaQueryList"] }
sha1 = "0.11.0"
tracing = "0.1.44"
base64 = "0.22"

[features]
default = ["dotenvy", "dioxus-ui"]
dotenvy = ["dep:dotenvy"]
# Full UI with database/network - for desktop apps
dioxus-ui = ["dioxus", "dioxus-core", "dioxus_elements", "dioxus-signals", "js-sys", "web-sys", "tokio", "futures-util", "nosql_orm", "reqwest", "bcrypt", "uuid", "dirs"]
# Web UI only - no database/network - for wasm web apps
web-ui = ["dioxus", "dioxus-core", "dioxus_elements", "dioxus-signals", "js-sys", "web-sys"]
dioxus-desktop = ["dioxus", "dioxus-core", "dioxus_elements", "dioxus-signals", "tokio-tungstenite", "tokio", "futures-util", "nosql_orm", "reqwest", "bcrypt", "uuid", "dirs"]

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
tempfile = "3"
proptest = "1"

[lib]
