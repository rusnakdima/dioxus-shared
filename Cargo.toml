[package]
name = "dioxus-shared"
version = "0.1.0"
edition = "2021"
description = "Shared Rust library for Dioxus applications - pure Rust business logic"
authors = ["Your Name"]

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "8", features = ["chrono-impl"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }
futures-util = "0.3"

# Once cell
once_cell = "1"

# Error handling
thiserror = "2"

# nosql_orm for database
nosql_orm = { git = "https://github.com/rusnakdima/nosql_orm.git", branch = "main", features = ["json", "mongo", "full", "validators"] }

# Utilities
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.17"
dirs = "5"
log = "0.4"
paste = "1.0"
lazy_static = "1.5"
async-trait = "0.1"
anyhow = "1"

# HTTP client (for update checking)
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = "0.23"

# Environment loading
dotenvy = { version = "0.15", optional = true }

# Dioxus UI components (optional)
dioxus = { version = "0.8.0-alpha.0", optional = true, features = ["html", "macro", "hooks", "signals", "router", "lib"] }
dioxus-core = { version = "0.8.0-alpha.0", optional = true }
dioxus-html = { version = "0.8.0-alpha.0", optional = true }

[features]
default = ["dotenvy", "dioxus-ui"]
dotenvy = ["dep:dotenvy"]
dioxus-ui = ["dioxus", "dioxus-core", "dioxus-html"]

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
tempfile = "3"

[lib]
